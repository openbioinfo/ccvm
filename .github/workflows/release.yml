name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: ccvm-linux-x64
          - target: aarch64-unknown-linux-musl
            artifact: ccvm-linux-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: cross build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/ccvm dist/
          cp target/${{ matrix.target }}/release/ccvm-shim dist/
          cp target/${{ matrix.target }}/release/ccvm-codex-shim dist/
          tar -czf ${{ matrix.artifact }}.tar.gz -C dist ccvm ccvm-shim ccvm-codex-shim

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  build-windows:
    name: Build Windows (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            artifact: ccvm-windows-x64
          - target: aarch64-pc-windows-msvc
            artifact: ccvm-windows-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ccvm.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/ccvm-shim.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/ccvm-codex-shim.exe" dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            artifact: ccvm-macos-x64
          - target: aarch64-apple-darwin
            artifact: ccvm-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/ccvm dist/
          cp target/${{ matrix.target }}/release/ccvm-shim dist/
          cp target/${{ matrix.target }}/release/ccvm-codex-shim dist/
          tar -czf ${{ matrix.artifact }}.tar.gz -C dist ccvm ccvm-shim ccvm-codex-shim

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    name: Create Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ccvm-linux-x64.tar.gz
            ccvm-linux-arm64.tar.gz
            ccvm-macos-x64.tar.gz
            ccvm-macos-arm64.tar.gz
            ccvm-windows-x64.zip
            ccvm-windows-arm64.zip
          generate_release_notes: true
